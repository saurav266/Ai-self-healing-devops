apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-healing-node-app
  namespace: self-healing
  labels:
    app: self-healing-node-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: self-healing-node-app

  template:
    metadata:
      labels:
        app: self-healing-node-app

    spec:
      containers:
        - name: node-app

          image: saurav8789/self-healing-node-app:9

          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 3000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: http

            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3